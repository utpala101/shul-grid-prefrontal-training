<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>舒尔特方格</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
/* ===== Reset & Base ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f2ed;
  --surface:#ffffff;
  --surface-raised:#faf8f6;
  --surface-hover:#f5f2ed;
  --border:#e8e4df;
  --border-light:#e0dcd6;
  --border-hover:#d0ccc6;
  --text:#2a2622;
  --text-muted:#8a8680;
  --text-dim:#b0aca6;
  --accent:#c49a6c;
  --accent-dim:#b8895a;
  --accent-glow:rgba(196,154,108,0.12);
  --done:#6aab7a;
  --danger:#d47a6a;
  --radius:4px;
  --radius-lg:10px;
  --radius-xl:14px;
}
html{scroll-behavior:smooth}
body{
  font-family:"DM Sans","Helvetica Neue",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  -webkit-font-smoothing:antialiased;
}

/* ===== Container ===== */
.container{max-width:660px;width:100%}

/* ===== Header ===== */
.header{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:0 0 16px;border-bottom:1px solid var(--border);margin-bottom:20px;
}
.header-left{display:flex;align-items:baseline;gap:10px}
.header-title{
  font-family:"Playfair Display",Georgia,serif;
  font-size:22px;font-style:italic;font-weight:600;
  color:var(--accent);letter-spacing:0.3px;
}
.header-sub{font-size:12px;color:var(--text-dim);font-style:normal;font-weight:400}
.share-link{
  font-size:13px;color:var(--text-dim);text-decoration:none;
  display:flex;align-items:center;gap:4px;transition:color 0.15s;
  font-family:inherit;cursor:pointer;background:none;border:none;padding:4px 6px;
}
.share-link:hover{color:var(--accent-dim)}

/* ===== Controls ===== */
.controls{display:flex;align-items:center;gap:8px}
.controls select{
  padding:7px 10px;font-size:13px;font-weight:500;
  background:var(--surface);color:var(--text);
  border:1px solid var(--border);border-radius:var(--radius);
  cursor:pointer;font-family:inherit;min-width:76px;appearance:auto;
}
.controls select:focus{outline:none;border-color:var(--accent-dim)}
.btn{
  padding:7px 20px;font-size:13px;font-weight:600;border:none;
  border-radius:var(--radius);cursor:pointer;transition:all 0.2s;
  font-family:inherit;letter-spacing:0.3px;
}
.btn-start{
  background:var(--accent);color:#fff;
}
.btn-start:hover{background:var(--accent-dim);box-shadow:0 0 16px var(--accent-glow)}
.btn-start:disabled{opacity:0.3;cursor:not-allowed;box-shadow:none}
.btn-abandon{
  background:transparent;color:var(--text-dim);
  border:1px solid var(--border);padding:7px 14px;
}
.btn-abandon:hover{border-color:var(--danger);color:var(--danger)}
.btn-abandon.hide{display:none}

/* ===== Timer ===== */
.timer-hero{text-align:center;padding:14px 0 18px}
.timer-label{
  font-size:11px;color:var(--text-dim);letter-spacing:2.5px;
  text-transform:uppercase;margin-bottom:2px;
}
.timer-value{
  font-size:52px;font-weight:300;color:var(--accent-dim);
  font-variant-numeric:tabular-nums;letter-spacing:2px;
  line-height:1;transition:color 0.4s;font-family:inherit;
}
.timer-value.done{color:var(--done)}
.timer-sub{
  font-size:14px;color:var(--text-muted);margin-top:8px;
}
.timer-sub em{color:var(--accent-dim);font-style:normal;font-weight:500}

/* ===== Grid ===== */
.grid-wrapper{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-xl);padding:14px;
  box-shadow:0 2px 16px rgba(0,0,0,0.03),0 1px 4px rgba(0,0,0,0.02);
  transition:box-shadow 0.6s;position:relative;
}
.grid-wrapper.complete{
  animation:completePulse 1.2s ease-out;
}
@keyframes completePulse{
  0%{box-shadow:0 2px 16px rgba(0,0,0,0.03),0 1px 4px rgba(0,0,0,0.02)}
  50%{box-shadow:0 4px 32px rgba(196,154,108,0.10),0 0 0 1px rgba(196,154,108,0.06)}
  100%{box-shadow:0 2px 16px rgba(0,0,0,0.03),0 1px 4px rgba(0,0,0,0.02)}
}
.grid{
  display:grid;gap:2px;margin:0 auto;
  max-width:520px;width:100%;
}
.cell{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius);cursor:pointer;
  background:var(--surface-raised);border:1px solid var(--border-light);
  transition:border-color 0.2s,background 0.15s;
  user-select:none;-webkit-tap-highlight-color:transparent;min-width:0;
  font-weight:500;position:relative;
}
.cell:hover:not(.disabled){
  border-color:rgba(196,154,108,0.35);
  background:var(--surface-hover);
}
.cell:active:not(.disabled){transform:scale(0.96)}
.cell.disabled{cursor:default}
@keyframes cellHit{
  0%{box-shadow:0 0 0 0 rgba(196,154,108,0)}
  40%{box-shadow:0 0 0 3px rgba(196,154,108,0.2)}
  100%{box-shadow:0 0 0 0 rgba(196,154,108,0)}
}
.cell.hit{animation:cellHit .22s ease-out}

/* ===== Records ===== */
.records{margin-top:24px;padding-top:18px;border-top:1px solid var(--border)}
.records-header{
  font-family:"Playfair Display",Georgia,serif;
  font-size:17px;font-style:italic;color:var(--text-dim);
  margin-bottom:12px;font-weight:400;
}
.record-empty{
  font-size:14px;color:var(--text-dim);text-align:center;
  padding:20px 0;letter-spacing:0.3px;
}
.record-block{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:14px;margin-bottom:10px;
}
.record-summary{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:8px;gap:8px;flex-wrap:wrap;
}
.record-summary h3{
  font-size:14px;font-weight:600;color:var(--text);
}
.record-summary h3 span{font-weight:400;color:var(--text-dim);font-size:12px}
.record-stats{font-size:12px;color:var(--text-muted)}
.record-stats span{margin-left:12px}
.record-stats b{color:var(--text);font-weight:500}
.record-chart-wrap{width:100%;margin:4px 0 8px}
.record-chart-wrap canvas{width:100%;height:130px;display:block;border-radius:6px}
.record-list{display:flex;flex-direction:column}
.record-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 0;border-bottom:1px solid var(--border);
}
.record-item:last-child{border-bottom:none}
.record-rank{font-size:12px;color:var(--text-dim);min-width:28px;font-weight:500}
.record-time{font-size:14px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.record-date{font-size:11px;color:var(--text-dim);margin-left:8px}
.btn-delete{
  padding:2px 8px;font-size:11px;border:none;border-radius:3px;
  background:rgba(212,122,106,0.06);color:var(--danger);
  cursor:pointer;transition:all 0.15s;font-family:inherit;
}
.btn-delete:hover{background:rgba(212,122,106,0.14)}

/* ===== Footer ===== */
.footer{
  text-align:center;font-size:11px;color:var(--text-dim);
  padding:20px 0 4px;letter-spacing:0.8px;
}

/* ===== Toast ===== */
.toast-container{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{
  background:var(--danger);color:#fff;padding:12px 24px;border-radius:var(--radius-lg);
  font-size:14px;font-weight:500;box-shadow:0 4px 20px rgba(212,122,106,0.25);
  opacity:0;transform:translateY(-12px) scale(0.96);transition:all .3s ease;
  pointer-events:auto;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateY(0) scale(1)}
.toast.info{background:var(--accent);box-shadow:0 4px 20px var(--accent-glow)}

/* ===== Mobile ===== */
@media(max-width:480px){
  body{padding:14px}
  .header{flex-direction:column;gap:10px;align-items:stretch;margin-bottom:14px;padding-bottom:12px}
  .header-left{justify-content:center}
  .header-title{text-align:center;font-size:20px}
  .header-sub{text-align:center}
  .controls{justify-content:center}
  .timer-value{font-size:36px}
  .grid-wrapper{padding:8px}
  .cell{font-size:16px;border-radius:3px}
  .grid{gap:1.5px}
  .record-chart-wrap canvas{height:100px}
}
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="header-title">舒尔特方格</div>
      <div class="header-sub">Schulte Grid</div>
    </div>
    <div class="controls">
      <select id="sizeSelect">
        <option value="3">3×3</option>
        <option value="4">4×4</option>
        <option value="5" selected>5×5</option>
        <option value="6">6×6</option>
        <option value="7">7×7</option>
        <option value="8">8×8</option>
        <option value="9">9×9</option>
        <option value="10">10×10</option>
      </select>
      <button class="btn btn-start" id="btnStart">开始训练</button>
      <button class="btn btn-abandon hide" id="btnAbandon">放弃</button>
    </div>
  </div>

  <!-- Timer -->
  <div class="timer-hero">
    <div class="timer-label">用时</div>
    <div class="timer-value" id="timerDisplay">0.00</div>
    <div class="timer-sub" id="statusLine">准备就绪</div>
  </div>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Grid -->
  <div class="grid-wrapper" id="gridWrapper">
    <div class="grid" id="grid"></div>
  </div>

  <!-- Records -->
  <div class="records" id="records"></div>

  <div class="footer">视线固定中心 · 余光搜索</div>
</div>

<script>
// ===== Soft color palette for light bg =====
const COLORS = [
  '#d48a8a','#8ab48a','#8aaad4','#d4c06a','#b08ad4',
  '#6ab8b8','#d49a6a','#d48aaa','#6ab89e','#9a8ad4',
  '#c4bc6a','#8ab4a2','#8ab8d4','#d48a9a','#a8bc6a',
  '#aa8ad4','#6ad4b4','#d08ac0','#8aa0d4','#c4b06a',
  '#b49ad4','#6ac4a8','#d4a08a','#98b86a',
];

// ===== State =====
const state = {
  size:5,total:25,grid:[],colors:{},
  nextNum:0,status:'idle',startTime:0,elapsed:0,timerId:null,
  errorCount:0,
};

// ===== DOM =====
const $=id=>document.getElementById(id);
const gridEl=$('grid'),gw=$('gridWrapper'),ss=$('sizeSelect');
const btn=$('btnStart'),btnAbn=$('btnAbandon'),td=$('timerDisplay'),sl=$('statusLine'),re=$('records');

// ===== Fisher-Yates =====
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ===== Colors =====
function assignColors(n){const c={},pool=shuffle([...COLORS]);for(let i=1;i<=n;i++)c[i]=pool[(i-1)%pool.length];return c}

// ===== Grid =====
function genGrid(s){state.size=s;state.total=s*s;state.grid=shuffle(Array.from({length:state.total},(_,i)=>i+1));state.colors=assignColors(state.total)}

function renderGrid(){
  const s=state.size;
  gridEl.style.gridTemplateColumns=`repeat(${s},1fr)`;
  gridEl.innerHTML='';
  const isIdle=state.status==='idle';
  const fs=s>=8?'15px':s>=6?'18px':s>=4?'22px':'27px';
  state.grid.forEach(n=>{
    const c=document.createElement('div');
    c.className='cell'+(isIdle?' disabled':'');
    if(!isIdle){c.textContent=n;c.style.fontSize=fs}
    c.style.color=state.colors[n];
    c.dataset.num=n;c.addEventListener('click',()=>handleClick(n));
    gridEl.appendChild(c);
  });
}

// ===== Status =====
function updateStatus(){
  if(state.status==='idle'){
    td.textContent='0.00';td.className='timer-value';sl.textContent='准备就绪';
    return;
  }
  const e=state.status==='playing'?(performance.now()-state.startTime)/1000:state.elapsed;
  td.textContent=e.toFixed(2);
  td.className='timer-value'+(state.status==='completed'?' done':'');
  sl.innerHTML=state.status==='completed'
    ?`完成 · 用时 <em>${e.toFixed(2)}s</em>`
    :`下一个 <em>${state.nextNum}</em> · 进度 ${state.nextNum-1}/${state.total}`;
}

// ===== Timer =====
function startTimer(){
  state.startTime=performance.now();
  state.timerId=setInterval(()=>{
    if(state.status==='playing'){
      state.elapsed=(performance.now()-state.startTime)/1000;
      td.textContent=state.elapsed.toFixed(2);
    }
  },50);
}

// ===== Click =====
function handleClick(n){
  if(state.status!=='playing')return;
  if(n!==state.nextNum){
    state.errorCount++;
    if(state.errorCount===3){
      showToast('注意集中！连续点错 3 次了',true);
      state.errorCount=0;
    }
    return;
  }
  state.errorCount=0;
  const cell=gridEl.querySelector(`[data-num="${n}"]`);
  if(cell){cell.classList.add('hit');setTimeout(()=>cell.classList.remove('hit'),220)}
  state.nextNum++;updateStatus();
  if(state.nextNum>state.total)completeGame();
}

// ===== Toast =====
let toastTimer;
function showToast(msg,warn){
  const c=$('toastContainer');
  const t=document.createElement('div');
  t.className='toast'+(warn?'':' info');
  t.textContent=msg;
  c.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{
    t.classList.remove('show');
    setTimeout(()=>t.remove(),300);
  },2000);
}

// ===== Complete =====
function completeGame(){
  state.status='completed';
  clearInterval(state.timerId);state.timerId=null;
  state.elapsed=(performance.now()-state.startTime)/1000;
  td.textContent=state.elapsed.toFixed(2);td.className='timer-value done';
  sl.innerHTML=`完成 · 用时 <em>${state.elapsed.toFixed(2)}s</em>`;
  btn.textContent='再来一次';btn.disabled=false;
  btnAbn.classList.add('hide');
  gw.classList.remove('complete');void gw.offsetWidth;gw.classList.add('complete');
  saveRecord(state.size,state.elapsed);renderRecords();
}

// ===== Start =====
function startGame(){
  genGrid(parseInt(ss.value));
  state.nextNum=1;state.status='playing';state.elapsed=0;state.errorCount=0;
  if(state.timerId){clearInterval(state.timerId);state.timerId=null}
  btn.textContent='进行中';btn.disabled=true;
  btnAbn.classList.remove('hide');
  renderGrid();updateStatus();startTimer();
}

// ===== Reset =====
function resetGame(){
  state.status='idle';state.nextNum=0;state.elapsed=0;state.errorCount=0;
  if(state.timerId){clearInterval(state.timerId);state.timerId=null}
  btn.textContent='开始训练';btn.disabled=false;
  btnAbn.classList.add('hide');
  gw.classList.remove('complete');
  genGrid(parseInt(ss.value));renderGrid();updateStatus();
}

// ===== Records =====
function getR(){try{return JSON.parse(localStorage.getItem('schulte-records')||'{}')}catch{return{}}}
function setR(r){localStorage.setItem('schulte-records',JSON.stringify(r))}
function saveRecord(sz,t){
  const r=getR(),k=String(sz);
  if(!r[k])r[k]=[];
  r[k].push({time:Math.round(t*100)/100,date:new Date().toISOString()});
  r[k].sort((a,b)=>a.time-b.time);
  if(r[k].length>500)r[k]=r[k].slice(0,500);
  setR(r);
}
function deleteRecord(sz,idx){
  if(!confirm('确定删除这条记录？'))return;
  const r=getR(),k=String(sz);
  if(r[k]){r[k].splice(idx,1);if(!r[k].length)delete r[k];setR(r);renderRecords()}
}

// ===== Stats =====
function mean(a){return a.reduce((s,v)=>s+v,0)/a.length}
function variance(a){if(a.length<2)return 0;const m=mean(a);return a.reduce((s,v)=>s+(v-m)**2,0)/a.length}

// ===== Chart =====
function gk(u){return Math.exp(-0.5*u*u)/Math.sqrt(2*Math.PI)}
function bw(data){
  if(data.length<2)return 1;
  const m=mean(data),v=data.reduce((s,x)=>s+(x-m)**2,0)/(data.length-1),std=Math.sqrt(v);
  const srt=[...data].sort((a,b)=>a-b);
  const iqr=srt[Math.floor(.75*(srt.length-1))]-srt[Math.floor(.25*(srt.length-1))];
  return Math.max(.9*Math.min(std,iqr/1.34)*Math.pow(data.length,-.2),.01);
}
function kde(data,bw,n){
  if(data.length<2)return[];
  const mn=Math.min(...data),mx=Math.max(...data),pad=(mx-mn)*.2||.5,start=mn-pad,end=mx+pad,step=(end-start)/n;
  return Array.from({length:n+1},(_,i)=>{const x=start+i*step;let d=0;for(const v of data)d+=gk((x-v)/bw);return{x,y:d/(data.length*bw)}});
}
function drawChart(cv,records){
  const ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1,rect=cv.getBoundingClientRect();
  cv.width=rect.width*dpr;cv.height=rect.height*dpr;ctx.scale(dpr,dpr);
  const w=rect.width,h=rect.height;ctx.clearRect(0,0,w,h);
  const times=records.map(r=>r.time);
  if(times.length<2){
    ctx.fillStyle='#b0aca6';ctx.font='12px "DM Sans",sans-serif';ctx.textAlign='center';
    ctx.fillText('至少需要 2 条记录',w/2,h/2+4);return;
  }
  const m=mean(times),b=bw(times),density=kde(times,b,80);
  if(!density.length)return;
  const maxD=Math.max(...density.map(d=>d.y)),xMin=density[0].x,xMax=density[density.length-1].x;
  const pad={top:6,bottom:20,left:4,right:4},pw=w-pad.left-pad.right,ph=h-pad.top-pad.bottom;
  const toX=x=>pad.left+((x-xMin)/(xMax-xMin))*pw,toY=y=>pad.top+ph-(y/maxD)*ph;

  ctx.beginPath();ctx.moveTo(toX(density[0].x),h-pad.bottom);
  density.forEach(d=>ctx.lineTo(toX(d.x),toY(d.y)));
  ctx.lineTo(toX(density[density.length-1].x),h-pad.bottom);ctx.closePath();
  const g=ctx.createLinearGradient(0,pad.top,0,h-pad.bottom);
  g.addColorStop(0,'rgba(196,154,108,0.15)');g.addColorStop(1,'rgba(196,154,108,0.01)');
  ctx.fillStyle=g;ctx.fill();

  ctx.beginPath();density.forEach((d,i)=>i===0?ctx.moveTo(toX(d.x),toY(d.y)):ctx.lineTo(toX(d.x),toY(d.y)));
  ctx.strokeStyle='#c49a6c';ctx.lineWidth=1.5;ctx.stroke();

  const mx=toX(m);ctx.beginPath();ctx.setLineDash([3,4]);
  ctx.moveTo(mx,pad.top);ctx.lineTo(mx,h-pad.bottom);
  ctx.strokeStyle='rgba(212,122,106,0.5)';ctx.lineWidth=1;ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(212,122,106,0.6)';ctx.font='9px "DM Sans",sans-serif';ctx.textAlign='center';
  ctx.fillText('μ',mx,pad.top-2);

  ctx.fillStyle='#b0aca6';ctx.font='9px "DM Sans",sans-serif';ctx.textAlign='center';
  ctx.fillText(xMin.toFixed(1)+'s',pad.left,h-4);ctx.fillText(xMax.toFixed(1)+'s',w-pad.right,h-4);
}

// ===== Render records =====
function renderRecords(){
  const all=getR(),sizes=Object.keys(all).map(Number).sort((a,b)=>a-b);
  if(!sizes.length){
    re.innerHTML='<div class="records-header">训练记录</div><div class="record-empty">还没有记录，开始挑战吧</div>';
    return;
  }
  let html='<div class="records-header">训练记录</div>';
  for(const sz of sizes){
    const list=all[sz];if(!list||!list.length)continue;
    const times=list.map(r=>r.time),m=mean(times),v=variance(times);
    html+=`<div class="record-block">
      <div class="record-summary">
        <h3>${sz}×${sz} <span>(${list.length} 次)</span></h3>
        <div class="record-stats"><span>平均 <b>${m.toFixed(2)}s</b></span><span>方差 <b>${v.toFixed(2)}</b></span></div>
      </div>
      <div class="record-chart-wrap"><canvas id="c-${sz}"></canvas></div>
      <div class="record-list">${list.map((r,i)=>`<div class="record-item">
        <div class="record-rank">#${i+1}</div>
        <div><span class="record-time">${r.time.toFixed(2)}s</span><span class="record-date">${fmt(r.date)}</span></div>
        <button class="btn-delete" onclick="deleteRecord(${sz},${i})">删除</button>
      </div>`).join('')}</div>
    </div>`;
  }
  re.innerHTML=html;
  requestAnimationFrame(()=>{for(const sz of sizes){const c=document.getElementById('c-'+sz);if(c)drawChart(c,all[sz]||[])}});
}
function fmt(iso){try{const d=new Date(iso);return String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}catch{return iso}}

// ===== Abandon =====
function abandonGame(){
  if(!confirm('确定放弃本次挑战？'))return;
  resetGame();
}

// ===== Events =====
ss.addEventListener('change',()=>{if(state.status==='playing')return;resetGame()});
btn.addEventListener('click',startGame);
btnAbn.addEventListener('click',abandonGame);

// ===== Init =====
function init(){genGrid(parseInt(ss.value));renderGrid();updateStatus();renderRecords()}
init();
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderRecords,200)});
</script>
</body>
